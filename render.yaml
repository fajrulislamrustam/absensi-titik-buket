services:
  - type: web
    name: absensi-titik-buket
    env: node
    # Paket FREE: gratis, tanpa kartu, link permanen.
    # Catatan free: tidur setelah 15 mnt sepi (bangun ±1 mnt saat dibuka),
    # file foto/data ikut terhapus saat redeploy — rutin Export CSV dari menu Laporan.
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_LIMIT_MB
        value: 500
